version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: employee-auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refresh_token_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: employee-auth-redis
    ports:
      - '6379:6379'
    restart: always

volumes:
  pgdata:
